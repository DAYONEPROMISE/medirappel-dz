name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.7
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Lint
        run: gradle :app:lintDebug --no-daemon

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Assemble release APK (unsigned)
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: medirappeldz-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: medirappeldz-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Read app version
        run: |
          VER=$(grep -hoP 'versionName\s*=?\s*"\K[0-9.]+' app/build.gradle app/build.gradle.kts 2>/dev/null | head -1)
          CODE=$(grep -hoP 'versionCode\s*=?\s*\K[0-9]+' app/build.gradle app/build.gradle.kts 2>/dev/null | head -1)
          echo "APP_VERSION=${VER:-0.0.0}" >> "$GITHUB_ENV"
          echo "APP_CODE=${CODE:-0}" >> "$GITHUB_ENV"

      - name: Write release notes
        run: |
          {
            echo "# MediRappel-DZ v${APP_VERSION} (build ${GITHUB_RUN_NUMBER})"; echo ""
            echo "- Version: ${APP_VERSION}+${APP_CODE}"; echo "- Commit: ${GITHUB_SHA}"
            echo "- DZ 2026 OpenPencil pass (large-type state helpers)."
            echo "- Debug APK is installable; release APK is unsigned (test only)."; echo ""
            echo "## Files"; find app/build/outputs/apk -name '*.apk' -printf '- %f (%s bytes)\n'
          } > release-notes.md
          cat release-notes.md

      - name: Publish APKs to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.APP_VERSION }}-b${{ github.run_number }}
          name: MediRappel-DZ v${{ env.APP_VERSION }} (build ${{ github.run_number }})
          bodyFile: release-notes.md
          artifacts: "app/build/outputs/apk/debug/app-debug.apk,app/build/outputs/apk/release/*.apk"
